name: CI

# Build and test on every push to main. The app is Windows-only for now (global hotkeys use a Windows keyboard hook).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
          rustflags: ''
      - run: cargo build --release --locked
      - run: cargo test --locked
