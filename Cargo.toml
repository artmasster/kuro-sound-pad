[package]
name = "kuro-sound-pad"
version = "2.1.1"
edition = "2021"
description = "Kuro Sound Pad: 16 pads of sounds on global hotkeys"
authors = ["Art_Masster"]
repository = "https://github.com/artmasster/kuro-sound-pad"
publish = false

[[bin]]
name = "kuro-sound-pad"
path = "src/main.rs"

[dependencies]
iced = { version = "0.13", default-features = false, features = ["tiny-skia", "svg", "advanced", "lazy", "smol"] }
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }
rfd = { version = "0.15", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
png = "0.17"
sha2 = "0.10"
# The bundled sound library: squeezed, then encrypted (src/pack.rs).
miniz_oxide = "0.8"
chacha20poly1305 = "0.10"
# Updates come over the system's own TLS (Schannel on Windows) and its root store.
ureq = { version = "3", default-features = false, features = ["native-tls"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
# Test builds are used like the real thing; unoptimised, the software renderer is too slow to judge anything by.
opt-level = 2

[profile.dev.package."*"]
opt-level = 2

# tiny-skia's anti-aliased rect fill debug-asserts on a rect that covers two partial pixels and no whole one (a thin
# line at some offsets). Nothing is wrong there and release builds compile the assert out, but it takes a test build
# down.
[profile.dev.package.tiny-skia]
debug-assertions = false
