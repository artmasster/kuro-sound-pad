[package]
name = "kuro-sound-pad"
version = "2.0.0"
edition = "2021"
description = "Kuro Sound Pad: 16 pads of sounds on global hotkeys"
authors = ["Art_Masster"]
repository = "https://github.com/artmasster/kuro-sound-pad"
publish = false

[[bin]]
name = "kuro-sound-pad"
path = "src/main.rs"

[dependencies]
iced = { version = "0.13", default-features = false, features = ["tiny-skia", "svg", "canvas"] }
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }
rfd = { version = "0.15", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
png = "0.17"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
